<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a18"/>

  <!-- Grid overlay -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <line x1="0" y1="48" x2="48" y2="48" stroke="#f0ece4" stroke-width="0.3" opacity="0.06"/>
      <line x1="48" y1="0" x2="48" y2="48" stroke="#f0ece4" stroke-width="0.3" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border frame -->
  <rect x="6" y="6" width="1188" height="618" fill="none" stroke="#333330" stroke-width="1"/>

  <!-- Corner brackets -->
  <path d="M12 36V12h24" fill="none" stroke="#e8562a" stroke-width="3"/>
  <path d="M1188 36V12h-24" fill="none" stroke="#e8562a" stroke-width="3"/>
  <path d="M12 594v24h24" fill="none" stroke="#e8562a" stroke-width="3"/>
  <path d="M1188 594v24h-24" fill="none" stroke="#e8562a" stroke-width="3"/>

  <!-- Corner dots -->
  <rect x="12" y="12" width="5" height="5" fill="#e8562a"/>
  <rect x="1183" y="12" width="5" height="5" fill="#e8562a"/>
  <rect x="12" y="613" width="5" height="5" fill="#e8562a"/>
  <rect x="1183" y="613" width="5" height="5" fill="#e8562a"/>

  <!-- SY monogram — large -->
  <text x="160" y="400" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="260" font-weight="900" fill="#f0ece4" letter-spacing="-8">
    SY
  </text>
  <rect x="60" y="420" width="340" height="12" fill="#e8562a"/>

  <!-- Registration mark -->
  <circle cx="420" cy="200" r="20" fill="none" stroke="#f0ece4" stroke-width="3"/>
  <text x="420" y="210" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="26" font-weight="900" fill="#f0ece4">R</text>

  <!-- Divider -->
  <line x1="500" y1="80" x2="500" y2="550" stroke="#333330" stroke-width="1"/>

  <!-- Wordmark -->
  <text x="540" y="260" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="72" font-weight="700" fill="#f0ece4" letter-spacing="3">
    SYMPOZIUM
  </text>
  <text x="540" y="330" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="72" font-weight="700" fill="#e8562a" letter-spacing="3">
    .AI
  </text>

  <!-- Tagline -->
  <text x="542" y="390" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" fill="#8a8c82" letter-spacing="5">
    KUBERNETES-NATIVE AGENTIC CONTROL PLANE
  </text>

  <!-- Orange accent bar -->
  <rect x="540" y="410" width="200" height="4" fill="#e8562a"/>

  <!-- Status text bottom -->
  <text x="60" y="590" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8c82" letter-spacing="3">
    STATUS: OPERATIONAL
  </text>
  <text x="1140" y="590" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8c82" letter-spacing="3">
    SYMPOZIUM.AI
  </text>
</svg>
