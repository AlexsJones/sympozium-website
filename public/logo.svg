<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <!-- Background -->
  <rect width="600" height="160" rx="20" fill="#0a0f0d"/>

  <!-- Icon (centered vertically at x=80) -->
  <g transform="translate(45, 15) scale(0.65)">
    <!-- Top center arm (brightest mint) -->
    <line x1="100" y1="100" x2="100" y2="32" stroke="#6ee7b7" stroke-width="12" stroke-linecap="round"/>
    <!-- Top-right arm -->
    <line x1="100" y1="100" x2="155" y2="48" stroke="#4ade80" stroke-width="12" stroke-linecap="round"/>
    <!-- Bottom-right chevron arm -->
    <polyline points="100,100 152,138 132,168" fill="none" stroke="#3dd68c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom center arm (amber accent) -->
    <line x1="100" y1="100" x2="100" y2="168" stroke="#d4a537" stroke-width="12" stroke-linecap="round"/>
    <!-- Bottom-left chevron arm -->
    <polyline points="100,100 48,138 68,168" fill="none" stroke="#2ba86d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Top-left arm -->
    <line x1="100" y1="100" x2="45" y2="48" stroke="#34d399" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="175" y="95" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#e2e8f0" letter-spacing="-1">
    sympozium<tspan fill="#3dd68c">.ai</tspan>
  </text>

  <!-- Tagline -->
  <text x="177" y="122" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#6ee7b7" opacity="0.6" letter-spacing="3">
    KUBERNETES-NATIVE AGENTIC CONTROL PLANE
  </text>
</svg>
